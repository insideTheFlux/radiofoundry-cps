[package]
name = "rfcps"
description = "RadioFoundry codeplug editor for Windows and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rfcps-core = { path = "../core" }
rfcps-link = { path = "../link" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.37"
rfd = "0.18"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Drives the real App headless through AccessKit: no window, no display, no radio.
egui_kittest = { version = "0.37", features = ["eframe"] }
